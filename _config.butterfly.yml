# Navigation Settings
menu:
  首页: / || fas fa-home
  留言板: /message/ || fas fa-comments
  照片墙: /photos/ || fas fa-images

# Navigation bar logo image
logo:
  display_title: true
  display_post_title: true
  fixed: false

# Comments System
comments:
  use: twikoo
  text: true
  lazyload: false
  count: false
  card_post_count: false

# Twikoo
twikoo:
  envId: https://twikoo-server-beta.vercel.app
  region:
  visitor: false
  option:

card_announcement:
  enable: true
  content: 点击右上角即可进入留言板:)

# 背景图
inject:
  head:
    - |
      <style>
        body {
          background: url(/img/blzxnwl.jpg) center/cover no-repeat fixed !important;
        }
      </style>

# 音乐播放器
music:
  enable: true
  server: netease
  type: song
  id: 1992712131
  autoplay: false

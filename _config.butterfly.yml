# Navigation Settings
menu:
  首页: / || fas fa-home
  留言板: /message/ || fas fa-comments
  照片墙: /photos/ || fas fa-images
  音乐: /music/ || fas fa-music

# Navigation bar logo image
logo:
  display_title: true
  display_post_title: true
  fixed: false

# ========== 新增：侧边栏头像配置 ==========
avatar:
  img: /img/avatar.jpg   # 头像图片，放到 source/img/ 文件夹
  effect: false          # true=鼠标悬浮旋转，false=不旋转

# Comments System
comments:
  use: twikoo
  text: true
  lazyload: false
  count: false
  card_post_count: false

# Twikoo
twikoo:
  envId: https://twikoo-server-beta.vercel.app
  region:
  visitor: false
  option:

# 背景图和手机端修复
inject:
  head:
    - |
      <style>
        /* PC端 */
        body {
          background: url(/img/blzxnwl.jpg) center center/cover no-repeat fixed !important;
        }
        #page-header {
          background-color: rgba(0, 80, 60, 0.75) !important;
        }
        #page-header::before {
          background: transparent !important;
        }

        /* 手机端：修复拉伸 */
        @media (max-width: 768px) {
          body {
            background-attachment: scroll !important;
            background-position: center 30% !important;
          }
        }
      </style>

# Aside Settings
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: '北仑中学26届回忆录'
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/22lyrical
  card_announcement:
    enable: true
    content: '点击右上角即可进入留言板:)'
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
# Navigation Settings
menu:
  首页: / || fas fa-home
  留言板: /message/ || fas fa-comments
  照片墙: /photos/ || fas fa-images
  音乐: /music/ || fas fa-music

# Navigation bar logo image
logo:
  display_title: true
  display_post_title: true
  fixed: false

# Comments System
comments:
  use: twikoo
  text: true
  lazyload: false
  count: false
  card_post_count: false

# Twikoo
twikoo:
  envId: https://twikoo-server-beta.vercel.app
  region:
  visitor: false
  option:

card_announcement:
  enable: true
  content: 点击右上角即可进入留言板:)

# 背景图和音乐播放器
inject:
  head:
    - |
      <style>
        body::before {
          content: '';
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          /* 深绿色半透明 (最后一位的 0.8 是透明度，1.0为不透明，0为全透明) */
          background: rgba(15, 60, 35, 0.8) !important;
          /* 如果你想保留背景图片，并给图片蒙上一层深绿色滤镜，把上面那行注释掉，换成下面这行： */
          /* background: linear-gradient(rgba(15, 60, 35, 0.8), rgba(15, 60, 35, 0.8)), url(/img/blzxnwl.jpg) center/cover no-repeat fixed !important; */
          z-index: -1;
        }
        /* 移动端优化 */
        @media (max-width: 768px) {
          body::before {
            background: rgba(15, 60, 35, 0.8) !important;
          }
        }
      </style>
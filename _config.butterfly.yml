# Navigation Settings
menu:
  首页: / || fas fa-home
  留言板: /message/ || fas fa-comments
  照片墙: /photos/ || fas fa-images
  音乐: /music/ || fas fa-music

# Navigation bar logo image
logo:
  display_title: true
  display_post_title: true
  fixed: false

# ========== 新增：侧边栏头像配置 ==========
avatar:
  img: /img/avatar.png   # 头像图片，放到 source/img/ 文件夹
  effect: false          # true=鼠标悬浮旋转，false=不旋转

# Comments System
comments:
  use: twikoo
  text: true
  lazyload: false
  count: false
  card_post_count: false

# Twikoo
twikoo:
  envId: https://twikoo-server-beta.vercel.app
  region:
  visitor: false
  option:

card_announcement:
  enable: true
  content: 点击右上角即可进入留言板:)

# 背景图和音乐播放器
inject:
  head:
    - |
      <style>
        /* PC端：固定背景 */
        body {
          background: url(/img/blzxnwl.jpg) center/cover no-repeat fixed !important;
        }
        #page-header {
          background-color: rgba(0, 80, 60, 0.75) !important;
        }
        /* 移除标题上面那层遮罩 */
        #page-header::before {
          background: transparent !important;
        }

        /* 手机端：取消fixed，修复背景压缩 */
        @media (max-width: 768px) {
          body {
            background-attachment: scroll !important;
          }
        }
      </style>
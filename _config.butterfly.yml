# Navigation Settings
menu:
  首页: / || fas fa-home
  留言板: /message/ || fas fa-comments
  照片墙: /photos/ || fas fa-images
  音乐: /music/ || fas fa-music

# Navigation bar logo image
logo:
  display_title: true
  display_post_title: true
  fixed: false

# Comments System
comments:
  use: twikoo
  text: true
  lazyload: false
  count: false
  card_post_count: false

# Twikoo
twikoo:
  envId: https://twikoo-server-beta.vercel.app
  region:
  visitor: false
  option:

card_announcement:
  enable: true
  content: 点击右上角即可进入留言板:)

# 背景图和音乐播放器
inject:
  head:
    - |
      <style>
        #site-info {
          background: rgba(0, 80, 60, 0.75) !important;
        }
        body {
          background: url(/img/blzxnwl.jpg) center/cover no-repeat fixed !important;
        }
        /* #page-header 深绿半透明，和 #site-info 配色统一 */
        #page-header {
          background-color: rgba(0, 80, 60, 0.75) !important;
        }
      </style>